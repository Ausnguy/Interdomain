services:
  postgres:
    image: postgres:17
    container_name: interdomain-postgres
    environment:
      POSTGRES_DB: interdomain
      POSTGRES_USER: interdomain
      POSTGRES_PASSWORD: interdomain
    ports:
      - "5432:5432"
    volumes:
      - interdomain_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interdomain -d interdomain"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  interdomain_postgres_data:
