# Local development only needs postgres and kafka:
#   docker compose up -d postgres kafka
# The full stack (migrations, producer, consumer, maintenance, API, web) is
# behind the "app" profile:
#   docker compose --profile app up -d --build
x-app: &app
  build: .
  image: interdomain-app
  profiles: [app]
  restart: unless-stopped
  environment:
    # Inside the compose network the services are reached by name, not localhost.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-interdomain}
    POSTGRES_USER: ${POSTGRES_USER:-interdomain}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_BGP_TOPIC: bgp-updates
    RAW_RETENTION_HOURS: ${RAW_RETENTION_HOURS:-2}
    ROLLUP_RETENTION_DAYS: ${ROLLUP_RETENTION_DAYS:-7}

services:
  postgres:
    image: postgres:17
    container_name: interdomain-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interdomain}
      POSTGRES_USER: ${POSTGRES_USER:-interdomain}
      # Compose reads .env automatically. The password only takes effect the
      # first time the data volume is created; to change it later use
      # ALTER USER, then update .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Localhost only: nothing else on the network can reach the database.
      - "127.0.0.1:5432:5432"
    volumes:
      - interdomain_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interdomain -d interdomain"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    container_name: interdomain-kafka

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_DOCKER://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # RIS Live produces ~3k msg/s; keep about as much as Postgres retains.
      KAFKA_LOG_RETENTION_HOURS: 6

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  spark:
    image: spark:4.2.0-java21-python3
    container_name: interdomain-spark

    working_dir: /opt/interdomain

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: bgp-updates

    volumes:
      - .:/opt/interdomain:ro

    depends_on:
      kafka:
        condition: service_healthy

    command:
      - /opt/spark/bin/spark-submit
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0
      - /opt/interdomain/spark/bgp_stream.py

  # One-shot: creates or upgrades the tables, then exits. Everything else waits for it.
  migrate:
    <<: *app
    restart: "no"
    command: ["python", "scripts/init_db.py"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["uvicorn", "interdomain.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  producer:
    <<: *app
    command: ["python", "scripts/run_producer.py"]
    depends_on:
      kafka:
        condition: service_healthy

  consumer:
    <<: *app
    command: ["python", "scripts/run_consumer.py"]
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  maintenance:
    <<: *app
    command: ["python", "scripts/run_maintenance.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Static dashboard plus a reverse proxy for /api. Localhost only: put a
  # tunnel or TLS proxy in front of it to expose it.
  web:
    build: ./frontend
    image: interdomain-web
    profiles: [app]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  interdomain_postgres_data: